openapi: 3.0.0
info:
  title: Календарь звонков
  description: 'Календарь звонков: гость без регистрации записывается на звонок к владельцу.'
  version: 0.0.0
tags:
  - name: guest
  - name: owner
paths:
  /api/guest/v1/meeting-types:
    get:
      operationId: listGuestMeetingTypes
      description: Каталог типов встреч, отсортированный по `id`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeList'
      tags:
        - guest
  /api/guest/v1/slots:
    get:
      operationId: listGuestSlots
      description: Свободные слоты типа встречи на 14 дат окна записи, начиная с завтрашней.
      parameters:
        - name: meetingTypeId
          in: query
          required: true
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotCalendarEnvelope'
        '404':
          description: Ресурс не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: 'Ошибка данных: сообщения сгруппированы по полям запроса.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - guest
  /api/owner/v1/meeting-types:
    get:
      operationId: listOwnerMeetingTypes
      description: Список типов встреч владельца, отсортированный по `id`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeList'
      tags:
        - owner
    post:
      operationId: createOwnerMeetingType
      description: Создать тип встречи.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeEnvelope'
        '422':
          description: 'Ошибка данных: сообщения сгруппированы по полям запроса.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeRequest'
components:
  schemas:
    CreateMeetingTypeRequest:
      type: object
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          multipleOf: 15
        description:
          type: string
          nullable: true
          maxLength: 1000
      description: Данные нового типа встречи. Пустое описание сохраняется как `null`.
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          multipleOf: 15
      description: 'Тип встречи: шаблон звонка с названием, необязательным описанием и длительностью.'
    MeetingTypeEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MeetingType'
      description: Один тип встречи в конверте `data`.
    MeetingTypeList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MeetingType'
      description: Каталог типов встреч в порядке создания.
    NotFoundError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      description: Ресурс не найден.
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      description: |-
        Слот: свободный интервал длиной в длительность типа встречи.
        Время в ISO 8601 со смещением часового пояса владельца.
    SlotCalendar:
      type: object
      required:
        - timezone
        - days
      properties:
        timezone:
          type: string
          description: Часовой пояс владельца, например `Europe/Moscow`.
        days:
          type: array
          items:
            $ref: '#/components/schemas/SlotDay'
      description: Свободные слоты типа встречи на все даты окна записи.
    SlotCalendarEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SlotCalendar'
      description: Свободные слоты в конверте `data`.
    SlotDay:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
      description: |-
        Дата окна записи по поясу владельца и её свободные слоты по возрастанию.
        Дни без свободных слотов приходят с пустым списком.
    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      description: 'Ошибка данных: сообщения сгруппированы по полям запроса.'
