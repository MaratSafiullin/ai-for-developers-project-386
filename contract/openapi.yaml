openapi: 3.0.0
info:
  title: Call Calendar
  description: 'Call calendar: a guest books a call with the owner without signing up.'
  version: 0.0.0
tags:
  - name: guest
  - name: owner
paths:
  /api/guest/v1/meeting-types:
    get:
      operationId: listGuestMeetingTypes
      description: Meeting type catalog sorted by `id`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeList'
      tags:
        - guest
  /api/guest/v1/slots:
    get:
      operationId: listGuestSlots
      description: Free slots of a meeting type for the 14 booking window dates, starting tomorrow.
      parameters:
        - name: meetingTypeId
          in: query
          required: true
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotCalendarEnvelope'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: 'Invalid data: messages are grouped by request field.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - guest
  /api/owner/v1/meeting-types:
    get:
      operationId: listOwnerMeetingTypes
      description: Owner's meeting type list sorted by `id`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeList'
      tags:
        - owner
    post:
      operationId: createOwnerMeetingType
      description: Create a meeting type.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeEnvelope'
        '422':
          description: 'Invalid data: messages are grouped by request field.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeRequest'
components:
  schemas:
    CreateMeetingTypeRequest:
      type: object
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          multipleOf: 15
        description:
          type: string
          nullable: true
          maxLength: 1000
      description: Data for a new meeting type. An empty description is stored as `null`.
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          multipleOf: 15
      description: 'Meeting type: a call template with a name, an optional description, and a duration.'
    MeetingTypeEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MeetingType'
      description: A single meeting type in a `data` envelope.
    MeetingTypeList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MeetingType'
      description: Meeting type catalog in creation order.
    NotFoundError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      description: Resource not found.
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      description: |-
        Slot: a free interval as long as the meeting type duration.
        Times are ISO 8601 with the owner's time zone offset.
    SlotCalendar:
      type: object
      required:
        - timezone
        - days
      properties:
        timezone:
          type: string
          description: Owner's time zone, for example `Europe/Moscow`.
        days:
          type: array
          items:
            $ref: '#/components/schemas/SlotDay'
      description: Free slots of a meeting type for every date of the booking window.
    SlotCalendarEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SlotCalendar'
      description: Free slots in a `data` envelope.
    SlotDay:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
      description: |-
        A booking window date in the owner's time zone and its free slots in ascending order.
        Days without free slots come with an empty list.
    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      description: 'Invalid data: messages are grouped by request field.'
