name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A separate `on: release` workflow would never run: the release is created
  # with GITHUB_TOKEN, and its events do not trigger other workflows.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Trigger Render Deploy Of Release Commit
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: curl --fail --silent --show-error --request POST "${DEPLOY_HOOK_URL}&ref=${RELEASE_SHA}"
