name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Application
        run: composer setup

      - name: Install Playwright System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run CI Checks
        run: composer ci:check

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Image
        run: docker build --tag app .

      - name: Start Container
        run: docker run --detach --name app --env PORT=8080 --publish 8080:8080 app

      - name: Check Home Page Responds 200
        run: |
          for _ in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/ || true)
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Home page did not respond 200, last status: $status"
          docker logs app
          exit 1
